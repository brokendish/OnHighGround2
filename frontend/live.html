<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>全国災害ビューア — OnHighGround</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- /live 専用スタイル -->
    <link rel="stylesheet" href="/css/live/live.css" />
</head>
<body>

    <!-- ヘッダー -->
    <header id="live-header">
        <span>
            <span class="live-title">全国災害ビューア</span>
            <span class="live-title-sub">LIVE</span>
        </span>
        <a class="live-nav-link" href="/">避難ナビへ</a>
    </header>

    <!-- 地図 -->
    <div id="live-map"></div>

    <!-- レイヤー切替パネル（右上） -->
    <div id="live-layer-panel">
        <div class="live-panel-title">レイヤー</div>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-rain" checked>
            雨雲
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-kikikuru">
            キキクル
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-earthquake" checked>
            地震
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-tsunami" checked>
            津波
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-storm-surge" checked>
            高潮
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-tide">
            潮位観測点
        </label>
        <hr class="live-panel-sep">
        <div id="live-sun-moon-card">
            <div class="live-panel-title">日月情報</div>
            <div id="live-sun-moon-body" class="live-sm-error">読み込み中...</div>
        </div>
    </div>

    <!-- アクティブ警戒カード（左上） -->
    <div id="live-alert-card"></div>

    <!-- ステータスバー（下部） -->
    <div id="live-status-bar"></div>

    <!-- ローディング -->
    <div id="live-loading">読み込み中...</div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- /live 専用 JS（依存順）-->
    <script src="/js/live/live-map.js"></script>
    <script src="/js/live/live-layers.js"></script>
    <script src="/js/live/live-earthquake-layer.js"></script>
    <script src="/js/live/live-tide-layer.js"></script>
    <script src="/js/live/live-tsunami-layer.js"></script>
    <script src="/js/live/live-storm-surge-layer.js"></script>
    <script src="/js/live/live-sun-moon-card.js"></script>
    <script src="/js/live/live-danger-summary.js"></script>
    <script src="/js/live/live-alert-panel.js"></script>
    <script src="/js/live/live-ui.js"></script>
    <script src="/js/live/live-main.js"></script>
    <script src="/js/live/live-mobile.js"></script>
    <script src="/js/live/live-location.js"></script>
    <script src="/js/live/live-gesture.js"></script>
    <script src="/js/live/live-legend.js"></script>

</body>
</html>
