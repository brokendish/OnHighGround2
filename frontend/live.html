<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>全国災害ビューア — OnHighGround</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- /live 専用スタイル -->
    <link rel="stylesheet" href="/css/live/live.css" />
    <link rel="stylesheet" href="/css/live/live-train.css" />
    <link rel="stylesheet" href="/css/live/live-train-label.css" />
    <link rel="stylesheet" href="/css/live/live-road-traffic.css" />
    <link rel="stylesheet" href="/css/live/live-road-label.css" />
    <link rel="stylesheet" href="/css/live/live-weather-ticker.css" />
</head>
<body>

    <!-- ヘッダー -->
    <header id="live-header">
        <span>
            <span class="live-title">全国災害ビューア</span>
            <span class="live-title-sub">LIVE</span>
        </span>
        <a class="live-nav-link" href="/">避難ナビへ</a>
    </header>

    <!-- 地図 -->
    <div id="live-map"></div>

    <!-- レイヤー切替パネル（右上） -->
    <div id="live-layer-panel">
        <div class="live-panel-title">レイヤー</div>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-rain" checked>
            雨雲
        </label>
        <!-- 雨雲予測タイムライン (Phase 5-B) -->
        <div id="live-rain-timeline" class="live-rain-tl hidden">
            <div class="live-rain-tl-info">
                <span id="rain-tl-offset">現在</span>
                <span id="rain-tl-time">--:--</span>
                <button id="rain-tl-play" class="live-rain-tl-btn" aria-label="再生/停止">▶</button>
            </div>
            <input type="range" id="rain-tl-slider" class="live-rain-tl-slider"
                   min="0" max="12" step="1" value="0" aria-label="予測時刻">
        </div>
        <div class="live-toggle-group">
            <label class="live-toggle">
                <input type="checkbox" id="toggle-kikikuru">
                キキクル
            </label>
            <div id="kikikuru-sub" class="live-kikikuru-sub hidden">
                <label class="live-toggle live-toggle-sub">
                    <input type="checkbox" id="toggle-kikikuru-land" checked>
                    土砂災害
                </label>
                <label class="live-toggle live-toggle-sub">
                    <input type="checkbox" id="toggle-kikikuru-inund" checked>
                    浸水害
                </label>
                <label class="live-toggle live-toggle-sub">
                    <input type="checkbox" id="toggle-kikikuru-flood" checked>
                    洪水害
                </label>
            </div>
        </div>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-earthquake" checked>
            地震
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-tsunami" checked>
            津波
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-storm-surge" checked>
            高潮
        </label>
        <div id="storm-surge-coast-hint" class="live-surge-hint hidden">
            ⚠ 浸水想定は<a class="live-surge-hint-link" href="/">避難ナビ</a>で確認
        </div>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-tide">
            潮位観測点
        </label>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-train">
            鉄道運行影響
        </label>
        <div id="train-layer-hint">ODPT加盟路線のみ・障害発生時に路線を表示</div>
        <label class="live-toggle">
            <input type="checkbox" id="toggle-road-traffic">
            道路交通影響
        </label>
        <div id="road-traffic-layer-hint">交通量APIに基づく観測点表示</div>
        <hr class="live-panel-sep">
        <!-- 全国気象ミニテロップ (Phase 8-A.1): Open-Meteo Forecast backend proxy 経由。
             警報・キキクル等とは独立した補助情報。 -->
        <div id="live-weather-card">
            <div class="wm-hd-inline">
                <span class="live-panel-title">全国気象</span>
                <span class="wm-src" id="weather-source" data-testid="live-weather-source-badge">Open-Meteo Forecast</span>
            </div>
            <div class="wm-meta" id="weather-meta" data-testid="live-weather-meta">取得中...</div>
            <div class="wm-body wm-body--list" id="weather-body" data-testid="live-weather-grid"></div>
        </div>
        <hr class="live-panel-sep">
        <div id="live-sun-moon-card">
            <div class="live-panel-title">日月情報</div>
            <div id="live-sun-moon-body" class="live-sm-error">読み込み中...</div>
        </div>
    </div>

    <!-- アクティブ警戒カード（左上） -->
    <div id="live-alert-card"></div>

    <!-- ステータスバー（下部） -->
    <div id="live-status-bar"></div>

    <!-- ローディング -->
    <div id="live-loading">読み込み中...</div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- protomaps-leaflet: PMTiles ベクタータイルレンダラー (Phase 7-A.5) -->
    <!-- 全国鉄道路線 PMTiles 表示に使用。Leaflet 1.8+ 必須。 -->
    <script src="https://unpkg.com/protomaps-leaflet@4.1.1/dist/protomaps-leaflet.js"></script>

    <!-- /live 専用 JS（依存順）-->
    <script src="/js/attribution-notices.js"></script>
    <!-- 背景地図 API キー設定 → 背景地図ヘルパー → 地図初期化 の順で読み込む -->
    <script src="/js/shared/runtime-config.js"></script>
    <script src="/js/shared/basemap.js"></script>
    <script src="/js/live/live-map.js"></script>
    <script src="/js/live/live-layers.js"></script>
    <script src="/js/live/live-earthquake-layer.js"></script>
    <script src="/js/live/live-tide-layer.js"></script>
    <script src="/js/live/live-tsunami-layer.js"></script>
    <script src="/js/live/live-storm-surge-layer.js"></script>
    <script src="/js/live/live-sun-moon-card.js"></script>
    <script src="/js/live/live-danger-summary.js"></script>
    <script src="/js/live/live-alert-panel.js"></script>
    <script src="/js/live/live-ui.js"></script>
    <!-- 全国鉄道路線 PMTiles ベース表示 (Phase 7-A.5-A/B): train-osm-layerより先に読む -->
    <script src="/js/live/live-train-pmtiles-layer.js"></script>
    <script src="/js/live/live-train-osm-layer.js"></script>
    <script src="/js/live/live-train-layer.js"></script>
    <script src="/js/live/live-train-panel.js"></script>
    <script src="/js/live/live-train-label-layer.js"></script>
    <script src="/js/live/live-road-osm-layer.js"></script>
    <script src="/js/live/live-road-label-layer.js"></script>
    <script src="/js/live/live-road-traffic-layer.js"></script>
    <script src="/js/live/live-road-traffic-panel.js"></script>
    <script src="/js/live/live-rain-timeline.js"></script>
    <!-- 全国気象ミニテロップ (Phase 8-A.1): 他モジュールに依存しない自己完結ウィジェット -->
    <script src="/js/live/live-weather-ticker.js"></script>
    <script src="/js/live/live-main.js"></script>
    <script src="/js/live/live-mobile.js"></script>
    <script src="/js/live/live-location.js"></script>
    <script src="/js/live/live-gesture.js"></script>
    <script src="/js/live/live-legend.js"></script>

</body>
</html>
