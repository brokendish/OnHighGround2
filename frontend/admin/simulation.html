<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シミュレーション — OnHighGround2</title>
  <link rel="stylesheet" href="/admin/simulation.css">
</head>
<body>

<header class="sim-header">
  <div>
    <h1>OnHighGround2 — Simulation / Inspection Mode</h1>
    <div class="sim-header-sub">災害シナリオをシミュレートし、ルート判断の妥当性を確認します</div>
  </div>
  <div class="sim-header-links">
    <a href="/admin/datasets.html">データ管理</a>
    <a href="/">← メインマップへ</a>
  </div>
</header>

<div class="sim-body">

  <!-- 定義済みシナリオ -->
  <section class="sim-scenario-bar">
    <div class="sim-scenario-bar-title">定義済みシナリオ</div>
    <div id="scenario-buttons" class="sim-scenario-buttons">
      <span class="sim-scenario-loading">読み込み中…</span>
    </div>
    <button class="sim-auto-run-btn" id="auto-run-btn" type="button">
      一括実行 (Auto-Run)
    </button>
  </section>

  <div class="sim-main">

    <!-- 左: パラメータパネル -->
    <aside class="sim-params">
      <h2 class="sim-panel-title">シナリオパラメータ</h2>

      <div class="sim-param-group">
        <div class="sim-param-label">出発地 (lon, lat)</div>
        <div class="sim-param-row">
          <input id="p-origin-lon" type="number" step="0.000001" placeholder="経度 139.767..." value="139.767125">
          <input id="p-origin-lat" type="number" step="0.000001" placeholder="緯度 35.681..." value="35.681236">
        </div>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">目的地 (lon, lat)</div>
        <div class="sim-param-row">
          <input id="p-dest-lon" type="number" step="0.000001" placeholder="経度" value="139.780000">
          <input id="p-dest-lat" type="number" step="0.000001" placeholder="緯度" value="35.690000">
        </div>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">降水強度（現在）</div>
        <select id="p-current-intensity">
          <option value="none">なし</option>
          <option value="weak">弱い</option>
          <option value="moderate">中程度</option>
          <option value="strong">強い</option>
          <option value="severe">非常に激しい</option>
        </select>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">降水強度（予報最大）</div>
        <select id="p-forecast-intensity">
          <option value="none">なし</option>
          <option value="weak">弱い</option>
          <option value="moderate">中程度</option>
          <option value="strong">強い</option>
          <option value="severe">非常に激しい</option>
        </select>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">警報 severity</div>
        <select id="p-alert-severity">
          <option value="none">なし</option>
          <option value="advisory">注意報</option>
          <option value="warning">警報</option>
          <option value="emergency">特別警報</option>
        </select>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">気象オプション</div>
        <label class="sim-toggle-row">
          <input type="checkbox" id="p-weather-unknown">
          <span>気象リスク判定不能 (unknown)</span>
        </label>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">ハザード</div>
        <label class="sim-toggle-row"><input type="checkbox" id="p-h-lowland"><span>低地・排水困難</span></label>
        <label class="sim-toggle-row"><input type="checkbox" id="p-h-flood"><span>洪水想定区域</span></label>
        <label class="sim-toggle-row"><input type="checkbox" id="p-h-inland-flood"><span>内水氾濫想定区域</span></label>
        <label class="sim-toggle-row"><input type="checkbox" id="p-h-landslide"><span>土砂災害警戒区域</span></label>
        <label class="sim-toggle-row"><input type="checkbox" id="p-h-tsunami"><span>津波想定区域</span></label>
        <label class="sim-toggle-row"><input type="checkbox" id="p-h-storm-surge"><span>高潮想定区域</span></label>
      </div>

      <div class="sim-param-group">
        <div class="sim-param-label">ハザードオプション</div>
        <label class="sim-toggle-row">
          <input type="checkbox" id="p-hazard-unavailable">
          <span>ハザード情報確認不可 (unavailable)</span>
        </label>
      </div>

      <button class="sim-run-btn" id="run-btn" type="button">
        シミュレーション実行
      </button>
    </aside>

    <!-- 右: 結果パネル -->
    <main class="sim-results" id="sim-results">
      <div class="sim-results-empty">
        <p>パラメータを設定して「シミュレーション実行」を押してください</p>
        <p style="font-size:12px;color:#94a3b8;">または上部の定義済みシナリオをクリックして読み込み後、実行してください</p>
      </div>
    </main>

  </div><!-- /.sim-main -->

</div><!-- /.sim-body -->

<!-- Auto-run 結果モーダル -->
<div id="auto-run-modal" class="sim-modal" style="display:none;">
  <div class="sim-modal-inner">
    <div class="sim-modal-header">
      <h2>Auto-Run 結果</h2>
      <button id="auto-run-modal-close" type="button" class="sim-modal-close">×</button>
    </div>
    <div id="auto-run-modal-body" class="sim-modal-body"></div>
  </div>
</div>

<script src="/admin/simulation.js"></script>
</body>
</html>
