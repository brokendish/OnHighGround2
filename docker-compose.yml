services:
  osrm-driving:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: evacuation-navi-osrm-driving
    ports:
      - "5500:5000"
    volumes:
      - ./data_lake:/data_lake
    command: >
      sh -c "
      mkdir -p /data_lake/validated/tokyo/osm/driving &&
      if [ ! -f /data_lake/validated/tokyo/osm/driving/kanto-260214.osrm ]; then
        rm -f /data_lake/validated/tokyo/osm/driving/kanto-260214.osrm* &&
        cp /data_lake/raw/tokyo/osm/kanto-260214.osm.pbf /data_lake/validated/tokyo/osm/driving/kanto-260214.osm.pbf &&
        osrm-extract -p /opt/car.lua /data_lake/validated/tokyo/osm/driving/kanto-260214.osm.pbf &&
        osrm-partition /data_lake/validated/tokyo/osm/driving/kanto-260214.osrm &&
        osrm-customize /data_lake/validated/tokyo/osm/driving/kanto-260214.osrm;
      fi &&
      osrm-routed --algorithm mld --port 5000 /data_lake/validated/tokyo/osm/driving/kanto-260214.osrm
      "
    restart: unless-stopped

  osrm-walking:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: evacuation-navi-osrm-walking
    ports:
      - "5501:5001"
    volumes:
      - ./data_lake:/data_lake
    command: >
      sh -c "
      mkdir -p /data_lake/validated/tokyo/osm/walking &&
      if [ ! -f /data_lake/validated/tokyo/osm/walking/kanto-260214.osrm ]; then
       rm -f /data_lake/validated/tokyo/osm/walking/kanto-260214.osrm* &&
       cp /data_lake/raw/tokyo/osm/kanto-260214.osm.pbf /data_lake/validated/tokyo/osm/walking/kanto-260214.osm.pbf &&
       osrm-extract -p /opt/foot.lua /data_lake/validated/tokyo/osm/walking/kanto-260214.osm.pbf &&
       osrm-partition /data_lake/validated/tokyo/osm/walking/kanto-260214.osrm &&
       osrm-customize /data_lake/validated/tokyo/osm/walking/kanto-260214.osrm;
      fi &&
       osrm-routed --algorithm mld --port 5001 /data_lake/validated/tokyo/osm/walking/kanto-260214.osrm
      "
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evacuation-navi-backend
    ports:
      - "8000:8000"
    volumes:
      # data_lake を正本としてマウント
      - ./data_lake:/app/data_lake:ro
      # legacy shelter fallback 用
      - ./国土地理院避難所データ:/app/shelter_data:ro
      # 開発時のホットリロード用
      - ./backend:/app
    environment:
      - DEM_FILE_PATH=/app/data_lake/validated/tokyo/dem/elevation.tif
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: evacuation-navi-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - osrm-driving
      - osrm-walking
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: evacuation-navi-martin
    volumes:
      - ./data_lake/tiles/tokyo:/tiles:ro
    command: /tiles
    restart: unless-stopped

networks:
  default:
    name: evacuation-navi-network
