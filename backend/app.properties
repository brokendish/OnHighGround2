# OnHighGround2 backend configuration (.properties)

# Path to DEM GeoTIFF file
# Relative paths are resolved from backend/ directory
# Canonical backend source: ../data_lake/validated/tokyo/dem/elevation.tif
# Legacy fallback: ../data/elevation.tif
dem.path=../data_lake/validated/tokyo/dem/elevation.tif

# 緊急避難場所CSVデータへのパス（カンマ区切り、ファイルまたはディレクトリ）
# Path to emergency shelter CSV data (comma-separated, file or directory)
# Default fallback (Docker): shelter_data/東京/13000_2/13000_2.csv
# evacuation.sites.pathに将来は全国CSVや都道府県ディレクトリを追加してください（カンマ区切りで複数可）。
# TODO: backend の shelter 正本も将来的には data_lake/validated/tokyo/shelter 由来に統一する。
evacuation.sites.path=shelter_data/東京/13000_2/13000_2.csv

# API server settings
api.host=0.0.0.0
api.port=8000
api.reload=true
api.log_level=info

# Application log level (for Python logging)
log.level=INFO

# CORS settings (comma-separated)
cors.allow_origins=*
cors.allow_credentials=true
cors.allow_methods=*
cors.allow_headers=*
