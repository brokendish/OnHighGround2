# OnHighGround2 backend configuration (.properties)

# Path to DEM GeoTIFF file
# Relative paths are resolved from backend/ directory
dem.path=../output.tif

# 緊急避難場所CSVデータへのパス（カンマ区切り、ファイルまたはディレクトリ）
# Path to emergency shelter CSV data (comma-separated, file or directory)
# Default fallback: ../国土地理院避難所データ/東京/13000_2/13000_2.csv
# evacuation.sites.pathに将来は全国CSVや都道府県ディレクトリを追加してください（カンマ区切りで複数可）。
evacuation.sites.path=../国土地理院避難所データ/東京/13000_2/13000_2.csv

# API server settings
api.host=0.0.0.0
api.port=8000
api.reload=true
api.log_level=info

# Application log level (for Python logging)
log.level=INFO

# CORS settings (comma-separated)
cors.allow_origins=*
cors.allow_credentials=true
cors.allow_methods=*
cors.allow_headers=*
