# OnHighGround2 backend configuration (.properties)

# Path to DEM GeoTIFF file
# Relative paths are resolved from backend/ directory
# Canonical backend source: ../data_lake/validated/tokyo/dem/elevation.tif
# Legacy fallback: ../data/elevation.tif
dem.path=../data_lake/validated/tokyo/dem/elevation.tif

# 緊急避難場所データへのパス（カンマ区切り、ファイルまたはディレクトリ）
# Path to emergency shelter data (comma-separated, file or directory)
# Canonical backend source: ../data_lake/validated/tokyo/shelter
# Legacy fallback: shelter_data/東京/13000_2/13000_2.csv
# TODO: legacy shelter_data fallback は data_lake 配下へ完全移行後に削除する。
evacuation.sites.path=../data_lake/validated/tokyo/shelter

# API server settings
api.host=0.0.0.0
api.port=8000
api.reload=true
api.log_level=info

# Application log level (for Python logging)
log.level=INFO

# Hazard flood data path (GeoJSON file)
# Canonical: ../data_lake/validated/tokyo/flood (use normalized as fallback)
hazard.flood.path=../data_lake/normalized/tokyo/flood/tokyo_flood_max.geojson

# Hazard tsunami data directory (GeoJSON files matching tsunami_{target}.geojson)
# validated/tokyo/tsunami は未整備のため normalized を使用
# TODO: data_lake/validated/tokyo/tsunami へ移行後にパスを更新する
hazard.tsunami.dir=../data_lake/normalized/tokyo/tsunami

# Tsunami load targets (comma-separated prefectures)
# Default: tokyo のみ（東京版 v1 標準モード）
# 広域モード: hazard.tsunami.targets=tokyo,kanagawa,chiba
hazard.tsunami.targets=tokyo

# 危険区域内候補（hazard_safe=false）を候補一覧から完全除外するか
# false（デフォルト）: 大幅減点（-100pt）して残す（全候補が危険な場合の fallback を確保）
# true: 除外（安全性を最優先。全候補が危険な場合のみ fallback として返す）
evacuation.exclude_unsafe_candidates=false

# Time Margin 設定（津波対応 v1）
# Time Margin = TTI（津波到達時間） - ET（避難所到達時間）
# TTI 計算方式: 現在地が入っている津波ポリゴンの重心までの距離 / 津波速度（v1 案A）
evacuation.enable_time_margin=true
evacuation.tsunami_speed_kmh=30

# Reachable Safe Area (RSA) 設定
# 到達可能円 - ハザードポリゴン = 避難可能エリア（v1 近似モデル）
# true: TTI が計算できた場合に RSA を算出してレスポンスに含める
evacuation.enable_reachable_safe_area=true
# 徒歩速度（m/s）— radius_m = speed × tti_minutes × 60
evacuation.walking_speed_mps=1.3

# CORS settings (comma-separated)
cors.allow_origins=*
cors.allow_credentials=true
cors.allow_methods=*
cors.allow_headers=*
