# OnHighGround2 backend configuration (.properties)

# Path to DEM GeoTIFF file
# Relative paths are resolved from backend/ directory
dem.path=../output.tif

# API server settings
api.host=0.0.0.0
api.port=8000
api.reload=true
api.log_level=info

# Application log level (for Python logging)
log.level=INFO

# CORS settings (comma-separated)
cors.allow_origins=*
cors.allow_credentials=true
cors.allow_methods=*
cors.allow_headers=*

# Optional: Path to municipal designated evacuation sites data (CSV/GeoJSON)
# CSV columns example: name,site_type,designation,lat,lon
# designation supports: 緊急避難場所 / 指定避難所
# evacuation.sites.path=../data/evacuation_sites.csv
