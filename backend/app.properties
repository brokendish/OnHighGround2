# OnHighGround2 backend configuration (.properties)

# Path to DEM GeoTIFF file
# Relative paths are resolved from backend/ directory
# [Phase 2] data_runtime を正規参照先とする。data_lake は自動フォールバック。
# deploy_to_runtime.sh で data_runtime/backend/elevation/elevation.tif を配備すること。
dem.path=../data_runtime/backend/elevation/elevation.tif

# 緊急避難場所データへのパス（カンマ区切り、ファイルまたはディレクトリ）
# Path to emergency shelter data (comma-separated, file or directory)
# [Phase 2] data_runtime を正規参照先とする。data_lake / legacy は自動フォールバック。
# deploy_to_runtime.sh で data_runtime/backend/shelters/ を配備すること。
evacuation.sites.path=../data_runtime/backend/shelters

# API server settings
api.host=0.0.0.0
api.port=8000
# reload=true は開発時専用。admin ingest/normalize/deploy を使う環境では false にすること。
# data_lake/ や *.tmp.geojson の書き換えで uvicorn が再起動し、実行中ジョブが中断される。
api.reload=false
api.log_level=info

# Application log level (for Python logging)
log.level=INFO

# 洪水ハザード判定の有効/無効
# 大容量データ（360MB超・666K ポリゴン）を全件ロードすると OOM になるためデフォルト無効。
# 有効にする前に filter_flood_hazard.py で GeoJSONL を生成すること:
#   python scripts/normalize/filter_flood_hazard.py
hazard.flood.enabled=true

# 判定用軽量 GeoJSONL（rank >= 2 フィルタ済み、ストリーミング読み込み対応）
# [Phase 2] data_runtime を正規参照先とする。
hazard.flood.check_path=../data_runtime/backend/hazard/flood/tokyo_flood_check.geojsonl

# 洪水ポリゴンの格子ギャップを埋める近傍バッファ（m）
# 0 にすると厳密なポリゴン内判定のみになります
hazard.flood.proximity_buffer_m=3

# 表示用フルデータ（フロントエンドが直接参照、バックエンドは使わない）
hazard.flood.path=../data_lake/normalized/tokyo/flood/tokyo_flood_max.geojson

# Hazard storm surge data path (GeoJSON file)
# [Phase 2] data_runtime を正規参照先とする。
hazard.storm_surge.path=../data_runtime/backend/hazard/storm_surge/tokyo_storm_surge.geojson

# Hazard tsunami data directory (GeoJSON files matching tsunami_{target}.geojson)
# [Phase 2] data_runtime を正規参照先とする。validated / normalized は自動フォールバック。
hazard.tsunami.dir=../data_runtime/backend/hazard/tsunami

# Tsunami load targets (comma-separated prefectures)
# frontend は tokyo/kanagawa/chiba の津波レイヤーを表示するため、
# backend も同じ範囲を判定対象とすること（表示範囲 ≠ 判定範囲 は false safe につながる）。
# 安全上: フロントで表示している全 prefectures を必ず含めること。
hazard.tsunami.targets=tokyo,kanagawa,chiba

# 内水氾濫ハザード判定
# [Phase 4] data_runtime/backend/hazard/inland_flood/ を優先参照。
# データ未配置の場合は data_lake/normalized/tokyo/inland_flood/ へフォールバック。
hazard.inland_flood.enabled=true
hazard.inland_flood.path=../data_runtime/backend/hazard/inland_flood/tokyo_inland_flood_A51.geojson

# 土砂災害ハザード判定
# [Phase 5] data_runtime/backend/hazard/landslide/ を優先参照。
# データ未配置の場合は data_lake/normalized/tokyo/landslide/ へフォールバック。
# 正規化: python scripts/normalize/normalize_landslide.py
# データ: 国土数値情報 A33（土砂災害警戒区域）
hazard.landslide.enabled=true
hazard.landslide.path=../data_runtime/backend/hazard/landslide/tokyo_landslide_A33.geojson

# 危険区域内候補（hazard_safe=false）を候補一覧から完全除外するか
# false（デフォルト）: 大幅減点（-100pt）して残す（全候補が危険な場合の fallback を確保）
# true: 除外（安全性を最優先。全候補が危険な場合のみ fallback として返す）
evacuation.exclude_unsafe_candidates=false

# Time Margin 設定（津波対応 v1）
# Time Margin = TTI（津波到達時間） - ET（避難所到達時間）
# TTI 計算方式: 現在地が入っている津波ポリゴンの重心までの距離 / 津波速度（v1 案A）
evacuation.enable_time_margin=true
evacuation.tsunami_speed_kmh=30

# Reachable Safe Area (RSA) 設定
# 到達可能円 - ハザードポリゴン = 避難可能エリア（v1 近似モデル）
# true: TTI が計算できた場合に RSA を算出してレスポンスに含める
evacuation.enable_reachable_safe_area=true
# 徒歩速度（m/s）— radius_m = speed × tti_minutes × 60
evacuation.walking_speed_mps=1.3

# CORS settings (comma-separated)
cors.allow_origins=*
cors.allow_credentials=true
cors.allow_methods=*
cors.allow_headers=*
