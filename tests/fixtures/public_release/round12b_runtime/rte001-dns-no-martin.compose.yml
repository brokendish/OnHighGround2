# NEW-RTE-001 negative control: identical to rte001-dns.compose.yml except
# the martin mock container is removed entirely. Real unmodified nginx.conf
# statically references `martin:3000`, so frontend MUST fail to start
# (proving the DNS-resolution probe in the primary fixture is not
# vacuously true -- a broken/absent upstream is actually detectable).
services:
  frontend:
    image: nginx:alpine
    volumes:
      - ../../../../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./empty_html:/usr/share/nginx/html:ro
  backend:
    image: nginx:alpine
  osrm-walking:
    image: nginx:alpine
