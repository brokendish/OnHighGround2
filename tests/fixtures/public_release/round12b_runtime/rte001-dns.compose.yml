# NEW-RTE-001 fixture (primary/positive): isolated frontend + mock
# osrm-walking/martin/backend upstreams, all listening, to verify
# Compose-DNS resolution before frontend readiness. Reuses the REAL,
# unmodified repo-root nginx.conf (application source is never
# copied/modified) so the DNS-resolution behavior under test matches the
# real static (non-resolver) proxy_pass upstream directives exactly. A
# minimal `backend` mock is included only because nginx.conf also
# statically references `backend:8000` -- without it nginx cannot start at
# all, independent of the osrm-walking/martin behavior under test.
#
# Also reused, unmodified, as:
#  - NEW-RTE-002A's negative control (all 4 real service definitions
#    present -> frontend MUST start successfully).
#  - NEW-RTE-002B's negative control base for the "listening" upstream
#    variant (see rte002b-listening.compose.yml).
services:
  frontend:
    image: nginx:alpine
    volumes:
      - ../../../../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./empty_html:/usr/share/nginx/html:ro
  backend:
    image: nginx:alpine
  osrm-walking:
    image: nginx:alpine
  martin:
    image: nginx:alpine
