# Phase 2-B.4 operator gateway — 静的operator UI配信 + 限定API proxy。
#
# Phase 2-B.2で受入済みのloopback publish sidecar（socat）を、静的配信と
# 限定allowlist proxyを行う単一nginx gatewayへ置き換える。service identity
# （profile／host port／network境界）はPhase 2-B.2から不変。
#
# route はすべて明示allowlist。genericな `location /api/` や任意upstream、
# request内容からpathを組み立てるproxyは行わない。未知pathはすべて404で、
# public SPAやoperator indexへのfallbackは行わない。
#
# Phase 2-B.4限定修正（CODEX P2B4-CX-003対応）: base nginx既定のaccess log
# format（`$request`＝メソッド＋path＋query文字列＋protocolをまとめて記録）
# は、誤送信されたquery-only token（401で拒否されるがrequest lineには
# 残る）をそのままログへ書き込んでしまう。`$uri`（query文字列を含まない
# path部分のみ）を使う専用formatに置き換え、認証は401契約のまま維持しつつ
# tokenらしき値がログへ残らないようにする。
log_format operator_safe '$remote_addr - [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

# OPERATOR-ADMIN-WEB-AUTH-AND-SHUTDOWN Phase B: login endpointのrate limit。
#
# CaddyがこのgatewayへリバースプロキシするようになるPhase C以降、
# $remote_addrは常に127.0.0.1（Caddy自身）になり、実クライアントIPでの
# per-IP制限は意味を持たない（$http_x_forwarded_for等、proxy越しの
# client IP headerを無条件に信用するのはこのPhaseではowner方針により
# 見送る——別途trusted-proxy設計が必要になるため）。
# 単一operatorの運用を想定し、per-IPではなくGLOBAL（全requestで共有する
# 単一bucket）のrate limitとする。mapで固定keyへ落とすことで実現する。
map $host $ohg_login_limit_key {
    default "global";
}

# 小さいburst + 低い持続rate。1分あたり6回（=平均10秒に1回）を持続レートとし、
# 3回までの即時burstを許容する（typoで2〜3回連続する程度は弾かない）。
limit_req_zone $ohg_login_limit_key zone=operator_login:1m rate=6r/m;

server {
    listen 8100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # directory listingを無効化（nginx既定でoffだが明示する）
    autoindex off;

    # Phase 2-B.4限定修正（CODEX P2B4-CX-003対応）: query文字列を含まない
    # 専用formatを使用する（上記 log_format operator_safe）。
    access_log /var/log/nginx/access.log operator_safe;

    # ── operator static UI ──────────────────────────────────────────────
    # /admin/ 配下のみを静的配信する。ファイル名を明示的に持たないpathは
    # =404（SPA/index fallbackは行わない）。より具体的な /admin/api/* location
    # が（nginxのlongest-prefix-match規則により）これより優先して評価される。
    location /admin/ {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # ── operator API proxy（明示allowlistのみ、/admin/api/* 配下に統一）─────
    # OPERATOR-ADMIN-WEB-AUTH-AND-SHUTDOWN Phase B: owner方針により、外部へ
    # 露出するoperator resourceはすべて /admin/* 配下に統一する
    # （Phase C で Caddy が `handle /admin/* { reverse_proxy 127.0.0.1:18100 }`
    # の1本だけでこのgateway全体を後ろに置けるようにするため）。
    # backend側の実route（/api/admin/*・/api/simulation/*・/api/login 等）は
    # 変更していない。ここでの外部path→内部pathの対応はproxy_passの
    # target URIで完結させ、genericなrewrite directiveは使わない
    # （既存allowlist方式のまま、新設4 routeも含め1 route = 1 location）。

    # login: session認証の唯一の入口。rate limitをここにだけ適用する。
    location = /admin/api/login {
        limit_req zone=operator_login burst=3 nodelay;
        proxy_pass http://backend-operator:8100/api/login;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    location = /admin/api/session {
        proxy_pass http://backend-operator:8100/api/session;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    location = /admin/api/logout {
        proxy_pass http://backend-operator:8100/api/logout;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    location = /admin/api/system/shutdown {
        proxy_pass http://backend-operator:8100/api/system/shutdown;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    # チャンクアップロード専用path。public nginx.confの /api/admin/upload/
    # と同じ既存要件（最大12GBチャンク、大容量ファイル）を維持し、これ以上
    # 緩和しない。より汎用な /admin/api/admin/ locationより先に評価されるよう
    # 個別locationとして定義する。
    location /admin/api/admin/upload/ {
        proxy_pass http://backend-operator:8100/api/admin/upload/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        client_max_body_size 12G;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin/api/admin/ {
        proxy_pass http://backend-operator:8100/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        # 管理画面からの大容量ファイルアップロード対応（既存public契約と同値）
        client_max_body_size 600m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # /admin/api/admin/logs/stream, /admin/api/admin/config/stream は
        # SSEのためbuffering off
        proxy_buffering off;
    }

    location /admin/api/simulation/ {
        proxy_pass http://backend-operator:8100/api/simulation/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # backend-operatorの既存read-only healthへのexact proxy（固定1:1 mapping。
    # request内容からpathを組み立てるものではない）。Docker healthcheckが
    # container内部loopbackから直接叩く運用のみを想定し、Caddyの
    # /admin/* allowlistには含めない（インターネットへ公開する必要がない）。
    location = /health {
        proxy_pass http://backend-operator:8100/operator/health;
        proxy_set_header Host $host;
    }

    # 上記以外はすべて404。public SPAやoperator indexへのfallbackを行わない。
    location / {
        return 404;
    }
}
