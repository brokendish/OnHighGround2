<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazard Layers — OnHighGround2 Admin</title>
    <link rel="stylesheet" href="/admin/hazards.css">
</head>
<body>

<header class="admin-header">
    <div>
        <h1>OnHighGround2 — Hazard Layers</h1>
        <div class="subtitle">read-only / 管理ダッシュボード</div>
    </div>
    <a class="back-link" href="/admin/">← 管理コンソールへ</a>
</header>

<div class="admin-body">

    <!-- エラーバー -->
    <div id="error-bar" class="error-bar"></div>

    <!-- サマリーカード -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="card-label">Active Layers</div>
            <div class="card-value" id="card-active">—</div>
        </div>
        <div class="summary-card">
            <div class="card-label">Vector Tile</div>
            <div class="card-value" id="card-vt">—</div>
        </div>
        <div class="summary-card">
            <div class="card-label">Fallback Capable</div>
            <div class="card-value" id="card-fallback">—</div>
        </div>
        <div class="summary-card">
            <div class="card-label">Planned</div>
            <div class="card-value" id="card-planned">—</div>
        </div>
        <div class="summary-card" id="catalog-card">
            <div class="card-label">Catalog (Martin)</div>
            <div>
                <span class="catalog-badge" id="catalog-badge">—</span>
                <span id="catalog-tilesets" style="font-size:11px; color:#64748b; margin-left:6px">—</span>
            </div>
        </div>
    </div>

    <!-- テーブル + 詳細パネル -->
    <div class="main-content">

        <!-- レイヤー一覧 -->
        <div class="table-card">
            <h2>HAZARD LAYERS</h2>
            <table class="layer-table">
                <thead>
                    <tr>
                        <th>Layer</th>
                        <th>Status</th>
                        <th>Main</th>
                        <th>Fallback</th>
                        <th>Severity</th>
                        <th>Tileset</th>
                        <th>Runtime</th>
                    </tr>
                </thead>
                <tbody id="layer-tbody">
                    <tr class="loading-row">
                        <td colspan="7">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 詳細パネル -->
        <div class="detail-panel">
            <h2>LAYER DETAIL</h2>
            <div id="detail-placeholder" class="detail-placeholder">
                レイヤーを選択してください
            </div>
            <div id="detail-body" class="detail-body">
                <div class="detail-name" id="detail-name"></div>
                <div class="detail-key"  id="detail-key"></div>
                <div class="detail-badges" id="detail-badges"></div>

                <div class="detail-section">属性</div>
                <div id="detail-attrs"></div>

                <div class="detail-section">パス</div>
                <div id="detail-paths"></div>

                <div class="detail-section">Notes</div>
                <div class="detail-notes" id="detail-notes"></div>

                <div class="detail-section">ドキュメント</div>
                <div class="detail-docs" id="detail-docs"></div>
            </div>
        </div>

    </div>
</div>

<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/hazards.js"></script>
</body>
</html>
