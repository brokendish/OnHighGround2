server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Phase 2-B.4: 管理画面はoperator/frontend-admin/へ物理分離し、
    # operator gateway（loopback限定）からのみ配信する。publicからは
    # 明示的に404とし、generic static handler／SPA fallbackで
    # index.htmlが200を返すことを防ぐ（第4節）。
    location = /admin {
        return 404;
    }
    location /admin/ {
        return 404;
    }
    location = /api/admin {
        return 404;
    }
    location /api/admin/ {
        return 404;
    }
    location = /api/simulation {
        return 404;
    }
    location /api/simulation/ {
        return 404;
    }

    # Phase 2-C P2C-CX-004対応（CODEX Round 8 BLOCKER）: `/api/simulation`は
    # 上記で明示404済みだが、public向けpath `/simulation`（/api/ プレフィクス外）
    # には対応するdeny locationがなく、generic `location /`のSPA fallback
    # （try_files ... /index.html）に一致してindex.htmlを200で返していた
    # （RTE-DENY-13-GET/HEAD=200、RTE-DENY-13-OPTIONS=405）。admin/docs等と
    # 同じ二層遮断方針に揃え、`^~`でregex locationより確実に優先させた上で
    # `/simulation`本体・`/simulation/`配下のいずれもSPA fallbackへ到達させず
    # 全HTTP method（`return`はmethodを区別しない）を明示404固定する。
    location = /simulation {
        return 404;
    }
    location ^~ /simulation/ {
        return 404;
    }

    # Phase 2-C（第3.1節）: FastAPI docs/OpenAPI はbackend側もproduction既定
    # （docs_url/redoc_url/openapi_url=None）で無効化済みだが、これらのpathは
    # /api/ プレフィクス外のためgeneric `location /` のSPA fallback
    # （try_files ... /index.html）に一致してindex.htmlを200で返してしまう。
    # admin/simulationと同じ方針で、nginx層でも明示的に404固定する
    # （二層遮断・SPA fallback非到達）。
    location = /docs { return 404; }
    location /docs/ { return 404; }
    location = /redoc { return 404; }
    location /redoc/ { return 404; }
    location = /openapi.json { return 404; }
    location /openapi.json/ { return 404; }

    # Phase 2-C（第4節）: metrics/diagnostics も同じ二層遮断を適用する。
    # /api/metrics, /api/diagnostics は /api/ proxy経由でbackendへ到達するが
    # backendに該当routeが存在しないため404になる（route table 0件）。
    # ここでの明示404はSPA fallback経路（/metrics, /diagnostics）を塞ぐことが
    # 主目的で、/api/ 配下も念のため同じ名前空間として明示しておく。
    location = /metrics { return 404; }
    location /metrics/ { return 404; }
    location = /diagnostics { return 404; }
    location /diagnostics/ { return 404; }
    location = /api/metrics { return 404; }
    location /api/metrics/ { return 404; }
    location = /api/diagnostics { return 404; }
    location /api/diagnostics/ { return 404; }

    # Phase 2-C（第5節）: public /health を固定した最小schemaのbackendへ
    # exact 1:1 proxyする。/health は /api/ プレフィクス外のため、この
    # locationを追加しない限りSPA fallbackへ落ちてindex.htmlが200で返る
    # （旧実装の実際の挙動）。operator/nginx.confの `location = /health`
    # と同型のexact proxyで、request内容からpathを組み立てない。
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Phase 2-B.4限定修正（CODEX P2B4-CX-002対応）: navigation-debug-layer.js は
    # operator/frontend-admin/js/ へ物理分離済みでpublic rootには存在しないが、
    # 末尾slash付きの旧URL（/js/navigation-debug-layer.js/）は generic
    # `location /`（try_files $uri $uri/ /index.html）のSPA fallbackに一致し、
    # public index.htmlを200で返してしまう。旧pathを末尾slash・query付きも含め
    # 明示的に404固定してSPA fallbackへ到達させない。
    location ~ ^/js/navigation-debug-layer\.js/?$ {
        return 404;
    }

    # CARTO Basemaps runtime config UX simplification: window.OHG2_RUNTIME_CONFIG
    # （CARTO_BASEMAP_API_KEY 等、browser-visible な公開設定）は frontend root
    # （read-only bind mount）の外側、コンテナ自身の書き込み可能な /run/ohg2/ へ
    # 起動時に生成される（scripts/frontend/generate_runtime_config.sh、
    # docker-entrypoint.d 経由）。exact match location でそこへ alias する。
    # frontend root 配下の frontend/js/shared/runtime-config.js（tracked default、
    # または旧 docker-compose.override.yml が差し込む実ファイル）は、生成
    # スクリプトが値の後方互換フォールバック元として読むだけで、直接配信はしない。
    location = /js/shared/runtime-config.js {
        alias /run/ohg2/runtime-config.js;
        add_header Cache-Control "no-store";
    }

    # 全国災害ビューア（/live）— live.html を提供
    location /live {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # [DEPRECATED] ハザードGeoJSON legacy 配信パス
    # Phase 2 で /layers/ への移行が完了したため、このパスは deprecated 扱い。
    # frontend/hazard/ は削除せず後方互換として残すが、新規参照は行わないこと。
    # Phase 3 で Martin 配信が安定した時点でこの location を削除する。
    location /hazard/ {
        try_files $uri =404;
        types {
            application/geo+json geojson;
            application/json json;
        }
        default_type application/geo+json;
    }

    # 公式レイヤー配信パス (Phase 1 で導入、Phase 2 以降にデータを配備)
    # frontend/layers/ を /layers/ として配信する。
    # deploy_to_runtime.sh で data_runtime/frontend/layers/ → frontend/layers/ へコピー後に有効になる。
    # 将来的に /hazard/ を廃止し、このパスに統一する。
    location /layers/ {
        try_files $uri =404;
        types {
            application/geo+json geojson;
            application/json json;
        }
        default_type application/geo+json;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # OSRMルーティングエンジンへのプロキシ（ローカルコンテナ）
    # /osrm/driving/ は osrm-driving が profiles: ["driving"] で通常非起動のため削除済み。
    # 復活する場合は docker compose --profile driving up -d で起動し、以下を再追加すること:
    #   location /osrm/driving/ {
    #       proxy_pass http://osrm-driving:5000/;
    #       proxy_set_header Host $host;
    #       add_header 'Access-Control-Allow-Origin' '*' always;
    #       add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    #       if ($request_method = 'OPTIONS') { return 204; }
    #   }

    # Phase 2-C（CODEX第1ラウンドP2C-CX-001対応、第6節の"Required correction"）:
    # 以下のOSRM/Martin/PMTiles配信は、backend（app_public.py）のFastAPI CORS
    # 契約（第6節、認証・状態変更を伴うAPI向けのexact-origin allowlist）とは
    # 意図的に別設計・別scopeとして扱う。いずれもGET専用・認証なし・
    # cookie/credentials不使用の公開geo tile/routing読み取りであり、
    # 地図描画library（Leaflet等）からのcross-origin読み込みを前提とした
    # 公開静的データ配信という性質上、wildcard CORSはこの用途では一般的かつ
    # 許容される設計判断である（tile CDN等と同種のrisk profile）。
    # public API（/api/、認証なし公開だが状態変更・計算処理を伴う）とは
    # 明確に区別し、混同しない。
    location /osrm/walking/ {
        # リテラル proxy_pass + 末尾スラッシュで /osrm/walking/ プレフィックスを自動除去する。
        # → OSRM には /route/v1/... の形式で到達する。
        # osrm-walking は depends_on で起動順序が保証されているため静的解決で問題ない。
        proxy_pass http://osrm-walking:5001/;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # APIへのプロキシ
    #
    # Phase 2-C（CODEX第1ラウンドP2C-CX-001対応）: このlocationがnginx独自の
    # `Access-Control-Allow-Origin: *` をalwaysで付与し、OPTIONSを204で
    # 直接短絡していたため、backend（app_public.py）のexact-origin
    # allowlist・fail-closed CORS実装（第6節）を全public API requestに対して
    # 完全に迂回していた（backendへ到達する前にnginxがCORSを解決してしまう
    # 構造上のbypass）。CORS正本をbackendのCORSMiddleware単独に一本化する
    # ため、ここではCORS関連のheader付与・OPTIONS短絡を一切行わない。
    # OPTIONSも含め全requestをbackendへそのままproxyし、preflight判定・
    # ACAO付与・fail-closedはbackend側のCORSMiddlewareにのみ委ねる
    # （nginxとbackendの二重CORS headerを防ぐ）。
    #
    # 旧コメント「管理画面からの大容量ファイルアップロード対応」は
    # Phase 2-B.4でadmin upload（/api/admin/upload/）がoperator/nginx.confへ
    # 物理分離済みのため、このlocationの対象ではなくなっている
    # （client_max_body_size/timeoutの見直しはPhase 2-C scope外のため維持）。
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 600m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Martin ベクタータイルサーバーへのプロキシ
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # PMTiles 静的配信（Range request 対応）
    # protomaps-leaflet が HTTP Range で必要な範囲のみ取得するため
    # Accept-Ranges・Content-Range ヘッダーを明示的に公開する。
    # Nginx の静的ファイル配信は Range request をデフォルトでサポートする。
    location ~* \.pmtiles$ {
        try_files $uri =404;
        types {
            application/x-protomaps pmtiles;
        }
        default_type application/x-protomaps;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
        # PMTiles は一度生成すると変更頻度が低いため長期キャッシュ
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 静的ファイルのキャッシュ設定
    # JS/CSS: no-cache（毎回サーバーに再確認。304 で差分なしなら転送なし）
    # ファイル名にハッシュを含まない構成のため immutable は使用しない
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # 画像・フォント: 変更頻度が低いため長期キャッシュ
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/geo+json application/javascript application/xml+rss;
}
