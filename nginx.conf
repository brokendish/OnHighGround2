server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理画面（/admin/）— 静的 HTML を .html 付きで解決
    location /admin/ {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # [DEPRECATED] ハザードGeoJSON legacy 配信パス
    # Phase 2 で /layers/ への移行が完了したため、このパスは deprecated 扱い。
    # frontend/hazard/ は削除せず後方互換として残すが、新規参照は行わないこと。
    # Phase 3 で Martin 配信が安定した時点でこの location を削除する。
    location /hazard/ {
        try_files $uri =404;
        types {
            application/geo+json geojson;
            application/json json;
        }
        default_type application/geo+json;
    }

    # 公式レイヤー配信パス (Phase 1 で導入、Phase 2 以降にデータを配備)
    # frontend/layers/ を /layers/ として配信する。
    # deploy_to_runtime.sh で data_runtime/frontend/layers/ → frontend/layers/ へコピー後に有効になる。
    # 将来的に /hazard/ を廃止し、このパスに統一する。
    location /layers/ {
        try_files $uri =404;
        types {
            application/geo+json geojson;
            application/json json;
        }
        default_type application/geo+json;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # OSRMルーティングエンジンへのプロキシ（ローカルコンテナ）
    # /osrm/driving/ は osrm-driving が profiles: ["driving"] で通常非起動のため削除済み。
    # 復活する場合は docker compose --profile driving up -d で起動し、以下を再追加すること:
    #   location /osrm/driving/ {
    #       proxy_pass http://osrm-driving:5000/;
    #       proxy_set_header Host $host;
    #       add_header 'Access-Control-Allow-Origin' '*' always;
    #       add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    #       if ($request_method = 'OPTIONS') { return 204; }
    #   }

    location /osrm/walking/ {
        # リテラル proxy_pass + 末尾スラッシュで /osrm/walking/ プレフィックスを自動除去する。
        # → OSRM には /route/v1/... の形式で到達する。
        # osrm-walking は depends_on で起動順序が保証されているため静的解決で問題ない。
        proxy_pass http://osrm-walking:5001/;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # APIへのプロキシ（CORS問題を回避）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 管理画面からの大容量ファイルアップロード対応
        client_max_body_size 600m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # CORS設定
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Upload-Id, X-Chunk-Index, X-Chunk-Offset' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # チャンクアップロード専用パス（各チャンクは最大10MB）
    # proxy_request_buffering off でメモリバッファを使わずに直接バックエンドへストリーミング
    location /api/admin/upload/ {
        proxy_pass http://backend:8000/api/admin/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 12G;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Upload-Id, X-Chunk-Index, X-Chunk-Offset' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Martin ベクタータイルサーバーへのプロキシ
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # 静的ファイルのキャッシュ設定
    # JS/CSS: no-cache（毎回サーバーに再確認。304 で差分なしなら転送なし）
    # ファイル名にハッシュを含まない構成のため immutable は使用しない
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # 画像・フォント: 変更頻度が低いため長期キャッシュ
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/geo+json application/javascript application/xml+rss;
}
